<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>لانشر</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;touch-action:manipulation}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#fff;overflow:hidden;
  background:#c1272d center/cover no-repeat;
  -webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.05) 45%,rgba(0,0,0,.5))}
::-webkit-scrollbar{display:none}
#flag{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;overflow:hidden;background:#c1272d}
#flag i{position:absolute;top:-4vh;height:108vh;background-repeat:no-repeat;animation:wave 3.2s ease-in-out infinite;will-change:transform}
#flag b{position:absolute;top:0;left:0;width:200%;height:100%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.2) 0,rgba(255,255,255,.07) 12.5%,rgba(0,0,0,.2) 25%);animation:shade 7s linear infinite}
@keyframes wave{0%,100%{transform:translateY(-1.6vh)}50%{transform:translateY(1.6vh)}}
@keyframes shade{to{transform:translateX(-50%)}}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:5vh 5vw}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:3vw;flex-wrap:wrap}
.time{font-size:11vw;font-size:clamp(56px,11vw,150px);font-weight:700;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.date{font-size:2.4vw;font-size:clamp(16px,2.4vw,32px);opacity:.9;margin-top:1vh}
.wx{text-align:end;font-size:2.4vw;font-size:clamp(16px,2.4vw,32px)}
.wx .t{font-size:7vw;font-size:clamp(40px,7vw,96px);font-weight:700;line-height:1}
.wx .c{opacity:.9}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1.5vw}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8vh;
  background:rgba(20,20,20,.55);color:#fff;text-decoration:none;border:3px solid transparent;border-radius:20px;
  padding:2vh 1vw;font-weight:600;font-size:1.9vw;font-size:clamp(14px,1.9vw,24px);font-family:inherit;cursor:pointer;outline:none;
  transition:transform .12s,border-color .12s,background .12s}
.tile .ic{font-size:4.5vw;font-size:clamp(28px,4.5vw,56px);line-height:1;margin-bottom:.5vh}
.tile:focus,.tile:hover{transform:scale(1.08);border-color:#3ddc97;background:rgba(20,20,20,.8);box-shadow:0 0 0 2px rgba(61,220,151,.35)}
#panel{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.8);z-index:5;align-items:center;justify-content:center}
#panel.on{display:flex}
.box{max-height:94vh;overflow:auto;width:90vw;max-width:520px;background:#1a211e;border-radius:24px;padding:4vh 3vw}
.box>*{margin:0 0 1.6vh}
.box h2{margin:0;font-size:2.6vw;font-size:clamp(20px,2.6vw,32px)}
.box .tile{width:100%;flex-direction:row;font-size:2vw;font-size:clamp(15px,2vw,24px)}
.box input{width:100%;padding:1.6vh 1vw;border-radius:14px;border:3px solid transparent;background:#0f1412;color:#fff;font:inherit;font-size:2vw;font-size:clamp(15px,2vw,24px);outline:none}
.box input:focus{border-color:#3ddc97}
.msg{min-height:1.2em;font-size:1.6vw;font-size:clamp(13px,1.6vw,20px);opacity:.85}
.sp{background:rgba(20,20,20,.55);border-radius:20px;padding:2vh 2vw;min-width:30vw}
.sp .sh{font-size:1.8vw;font-size:clamp(14px,1.8vw,24px);opacity:.9;margin-bottom:1vh}
.sp .sv{display:flex;justify-content:space-between;gap:2vw;direction:ltr;text-align:center}
.sp b{display:block;font-size:4vw;font-size:clamp(26px,4vw,56px);line-height:1}
.sp small{font-size:1.4vw;font-size:clamp(11px,1.4vw,18px);opacity:.8}
.sp .ss{margin-top:1vh;font-size:1.5vw;font-size:clamp(12px,1.5vw,20px);opacity:.85}
body.vl #flag{display:block!important;z-index:9}
#veille{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:10;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.3)}
body.vl #veille{display:flex}
#veille .vc{animation:drift 90s ease-in-out infinite;text-shadow:0 3px 18px rgba(0,0,0,.6)}
#veille .vt{font-size:18vw;font-size:clamp(80px,18vw,260px);font-weight:700;line-height:1}
#veille .vd{font-size:3.2vw;font-size:clamp(20px,3.2vw,44px);margin-top:2vh;opacity:.95}
#veille .vw{font-size:4.4vw;font-size:clamp(24px,4.4vw,64px);margin-top:4vh}
@keyframes drift{0%,100%{transform:translate(-3vw,-3vh)}50%{transform:translate(3vw,3vh)}}
.mt{align-self:flex-start;background:rgba(20,20,20,.55);border-radius:20px;padding:2vh 2vw;width:46vw;max-width:640px}
.mt .mh{font-size:1.8vw;font-size:clamp(14px,1.8vw,24px);opacity:.9;margin-bottom:.8vh}
.mt .mr{display:flex;justify-content:space-between;gap:2vw;padding:.8vh 0;border-top:1px solid rgba(255,255,255,.15);font-size:1.9vw;font-size:clamp(14px,1.9vw,26px)}
.mt .tm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt .tt{white-space:nowrap;opacity:.9}
.mt .ms{font-size:1.6vw;font-size:clamp(13px,1.6vw,22px);opacity:.85}
.tile[hidden]{display:none}
body.na #flag i,body.na #flag b{animation:none}
#apps{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:6;background:rgba(0,0,0,.92);padding:5vh 5vw;overflow:auto}
#apps.on{display:block}
#apps .ah{font-size:3vw;font-size:clamp(20px,3vw,40px);margin-bottom:3vh;font-weight:700}
#agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-gap:2vw;gap:2vw}
#agrid .tile{padding:2vh 1vw}
#agrid img.aic{width:64px;height:64px;object-fit:contain}
#agrid .an{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px;font-size:clamp(13px,1.6vw,20px)}
</style>
</head>
<body>
<div id="flag"></div>
<div class="wrap">
  <div class="top">
    <div><div class="time" id="time">--:--</div><div class="date" id="date"></div></div>
    <div class="sp">
      <div class="sh" data-i="spTitle"></div>

      </div>

    <div class="mh"><span data-i="mTitle"></span> · <span id="mlg"></span></div>

  </div>
</div>

<div id="panel">
  <div class="box" id="box">
    <h2 data-i="set"></h2>
    <button class="tile" id="pick" data-i="pick"></button>
    <button class="tile" id="clear" data-i="clear"></button>
    <button class="tile" id="lang"></button>
    <button class="tile" id="vlBtn"></button>
    <button class="tile" id="mBtn"></button>
    <button class="tile" id="aBtn"></button>
    <input id="city" type="text">
    <button class="tile" id="saveCity" data-i="saveCity"></button>
    <div class="msg" id="msg"></div>
    <button class="tile" id="close" data-i="close"></button>
  </div>
</div>
<div id="apps"><div class="ah" data-i="apps"></div><div id="agrid"></div></div>
<div id="veille"><div class="vc"><div class="vt" id="vt"></div><div class="vd" id="vd"></div><div class="vw" id="vw"></div></div></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
function $(i){return document.getElementById(i)}
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function sdel(k){try{localStorage.removeItem(k)}catch(e){}}

var KEYS={37:"ArrowLeft",38:"ArrowUp",39:"ArrowRight",40:"ArrowDown",27:"Escape",8:"Backspace",93:"ContextMenu",82:"Menu"};

var wakeLock = null;
async function keepAwake(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(e){}
}
keepAwake();
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible') keepAwake();
});

var T={
ar:{set:"الإعدادات",pick:"🖼️ اختيار خلفية من الملفات",clear:"🇲🇦 العودة إلى علم المغرب",city:"اكتب اسم مدينتك للطقس",saveCity:"📍 حفظ المدينة",close:"إغلاق",lang:"🌐 اللغة",auto:"تلقائي",loading:"جارٍ تحميل الطقس…",werr:"تعذر جلب الطقس",bgok:"تم تغيير الخلفية",bgsess:"تم التغيير لهذه الجلسة فقط",imgerr:"تعذر فتح الصورة",flagback:"تمت العودة إلى علم المغرب",searching:"جارٍ البحث…",nocity:"لم أجد هذه المدينة",saved:"تم الحفظ",noconn:"تعذر الاتصال بالإنترنت",yt:"يوتيوب",nf:"نتفليكس",tw:"تويتش",sp:"سبوتيفاي",gg:"جوجل",w0:"صافٍ",w1:"غائم جزئيًا",w3:"غائم",w45:"ضباب",w51:"رذاذ",w61:"مطر",w71:"ثلج",w80:"زخات مطر",w95:"عاصفة رعدية",spTitle:"سرعة الإنترنت",spBtn:"قياس السرعة",spRun:"جارٍ القياس…",sIdle:"اضغط ⚡ للقياس",sPing:"قياس زمن الاستجابة…",sDown:"قياس التنزيل…",sUp:"قياس الرفع…",sDone:"اكتمل القياس",sFail:"تعذر القياس، تحقق من الاتصال",vl:"🌙 وضع السكون",off:"إيقاف",min:"دقيقة",vlNow:"السكون الآن",mTitle:"⚽ المباريات",mLoad:"جارٍ تحميل المباريات…",mNone:"لا توجد مباريات قادمة",apps:"التطبيقات",anim:"🎞️ حركة العلم",on:"تشغيل",mErr:"تعذر تحميل المباريات",today:"اليوم",tmrw:"غدًا",s0:"المنتخب المغربي",s1:"البطولة المغربية",s2:"دوري أبطال أوروبا",s3:"الدوري الإنجليزي",s4:"الدوري الإسباني",s5:"الدوري الفرنسي",s6:"الدوري الإيطالي",s7:"الدوري الألماني"},
fr:{set:"Paramètres",pick:"🖼️ Choisir un fond depuis les fichiers",clear:"🇲🇦 Revenir au drapeau du Maroc",city:"Entrez votre ville pour la météo",saveCity:"📍 Enregistrer la ville",close:"Fermer",lang:"🌐 Langue",auto:"Automatique",loading:"Chargement de la météo…",werr:"Météo indisponible",bgok:"Fond modifié",bgsess:"Modifié pour cette session seulement",imgerr:"Impossible d’ouvrir l’image",flagback:"Retour au drapeau du Maroc",searching:"Recherche…",nocity:"Ville introuvable",saved:"Enregistré",noconn:"Pas de connexion Internet",yt:"YouTube",nf:"Netflix",tw:"Twitch",sp:"Spotify",gg:"Google",w0:"Dégagé",w1:"Partiellement nuageux",w3:"Nuageux",w45:"Brouillard",w51:"Bruine",w61:"Pluie",w71:"Neige",w80:"Averses",w95:"Orage",spTitle:"Vitesse Internet",spBtn:"Test de vitesse",spRun:"Mesure en cours…",sIdle:"Appuyez sur ⚡ pour mesurer",sPing:"Mesure de la latence…",sDown:"Mesure du téléchargement…",sUp:"Mesure de l’envoi…",sDone:"Mesure terminée",sFail:"Mesure impossible, vérifiez la connexion",vl:"🌙 Mise en veille",off:"Désactivée",min:"min",vlNow:"Mettre en veille",mTitle:"⚽ Matchs",mLoad:"Chargement des matchs…",mNone:"Aucun match à venir",apps:"Applications",anim:"🎞️ Animation du drapeau",on:"Activée",mErr:"Matchs indisponibles",today:"Aujourd’hui",tmrw:"Demain",s0:"Équipe du Maroc",s1:"Botola Pro",s2:"Ligue des champions",s3:"Premier League",s4:"La Liga",s5:"Ligue 1",s6:"Serie A",s7:"Bundesliga"},
en:{set:"Settings",pick:"🖼️ Choose wallpaper from files",clear:"🇲🇦 Back to Moroccan flag",city:"Enter your city for weather",saveCity:"📍 Save city",close:"Close",lang:"🌐 Language",auto:"Auto",loading:"Loading weather…",werr:"Weather unavailable",bgok:"Wallpaper changed",bgsess:"Changed for this session only",imgerr:"Could not open image",flagback:"Back to Moroccan flag",searching:"Searching…",nocity:"City not found",saved:"Saved",noconn:"No internet connection",yt:"YouTube",nf:"Netflix",tw:"Twitch",sp:"Spotify",gg:"Google",w0:"Clear",w1:"Partly cloudy",w3:"Cloudy",w45:"Fog",w51:"Drizzle",w61:"Rain",w71:"Snow",w80:"Showers",w95:"Thunderstorm",spTitle:"Internet speed",spBtn:"Speed test",spRun:"Testing…",sIdle:"Press ⚡ to test",sPing:"Measuring latency…",sDown:"Measuring download…",sUp:"Measuring upload…",sDone:"Test complete",sFail:"Test failed, check your connection",vl:"🌙 Screensaver",off:"Off",min:"min",vlNow:"Sleep now",mTitle:"⚽ Matches",mLoad:"Loading matches…",mNone:"No upcoming matches",apps:"Apps",anim:"🎞️ Flag animation",on:"On",mErr:"Matches unavailable",today:"Today",tmrw:"Tomorrow",s0:"Morocco national team",s1:"Botola Pro",s2:"Champions League",s3:"Premier League",s4:"La Liga",s5:"Ligue 1",s6:"Serie A",s7:"Bundesliga"}
};
var LN={ar:"العربية",fr:"Français",en:"English"},MODES=["auto","ar","fr","en"];
var LOC={ar:"ar-MA",fr:"fr-FR",en:"en-US"};
var lastW=null;
function sysLang(){var l=((navigator.languages&&navigator.languages[0])||navigator.language||"en").slice(0,2).toLowerCase();return T[l]?l:"en"}
function mode(){var m=sget("lang");return MODES.indexOf(m)<0?"auto":m}
function curLang(){var m=mode();return m==="auto"?sysLang():m}
var L=curLang();
function say(k){$("msg").textContent=k?T[L][k]:""}
function applyLang(){
  L=curLang();
  var h=document.documentElement;h.lang=L;h.dir=L==="ar"?"rtl":"ltr";
  [].forEach.call(document.querySelectorAll("[data-i]"),function(el){el.textContent=T[L][el.getAttribute("data-i")]});
  $("city").placeholder=T[L].city;
  var m=mode();
  $("lang").textContent=T[L].lang+": "+(m==="auto"?T[L].auto:LN[m]);
  $("vlBtn").textContent=vlText();
  $("mBtn").textContent=T[L].mTitle+": "+T[L]["s"+srcIdx()];
  $("aBtn").textContent=T[L].anim+": "+(sget("noanim")==="1"?T[L].off:T[L].on);
  renderMatches();
  if(lastW)showWx(lastW);
  tick();
}

function tick(){
  var d=new Date();
  $("time").textContent=d.toLocaleTimeString(LOC[L],{hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
  $("date").textContent=d.toLocaleDateString(LOC[L],{weekday:"long",day:"numeric",month:"long"});
  $("vt").textContent=$("time").textContent;$("vd").textContent=$("date").textContent;
}
tick();setInterval(tick,2000);

var flag=$("flag"),N=24;
var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#c1272d"/><polygon points="800,220 935.19,636.07 581.25,378.93 1018.75,378.93 664.81,636.07" fill="none" stroke="#006233" stroke-width="22" stroke-linejoin="miter"/></svg>';
var img="url(data:image/svg+xml,"+encodeURIComponent(svg)+")";
for(var s=0;s<N;s++){
  var e=document.createElement("i");
  e.style.cssText="left:"+(s*100/N)+"%;width:"+(100/N+0.3)+"%;background-image:"+img+
    ";background-size:100vw 100vh;background-position:-"+(s*100/N)+"vw 4vh;animation-delay:-"+(s*0.14)+"s";
  flag.appendChild(e);
}
flag.appendChild(document.createElement("b"));

function applyBg(){
  var b=sget("bg");
  document.body.style.backgroundImage=b?"url("+b+")":img;
  document.body.classList.toggle("na",sget("noanim")==="1");
  flag.style.display=b?"none":"block";
}
applyBg();
$("pick").onclick=function(){$("file").click()};
$("file").onchange=function(){
  var f=this.files&&this.files[0];if(!f)return;
  var im=new Image(),url=URL.createObjectURL(f);
  im.onload=function(){
    var w=Math.min(1600,im.width),h=Math.round(im.height*w/im.width);
    var c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(im,0,0,w,h);
    var data=c.toDataURL("image/jpeg",0.8);
    URL.revokeObjectURL(url);
    if(sset("bg",data)){applyBg();say("bgok")}
    else{document.body.style.backgroundImage="url("+data+")";flag.style.display="none";say("bgsess")}
  };
  im.onerror=function(){say("imgerr")};
  im.src=url;
};
$("clear").onclick=function(){sdel("bg");applyBg();say("flagback")};

function wx(c){
  if(c==0)return["☀️","w0"];if(c<=2)return["🌤️","w1"];if(c==3)return["☁️","w3"];
  if(c<=48)return["🌫️","w45"];if(c<=57)return["🌦️","w51"];if(c<=67)return["🌧️","w61"];
  if(c<=77)return["❄️","w71"];if(c<=82)return["🌦️","w80"];if(c<=86)return["❄️","w71"];
  return["⛈️","w95"];
}
function showWx(o){
  lastW=o;
  var w=wx(o.code);
  $("wt").textContent=w[0]+" "+Math.round(o.temp)+"°";
  $("wc").removeAttribute("data-i");
  $("wc").textContent=T[L][w[1]];
  $("wl").textContent=o.name||"";
  $("vw").textContent=w[0]+" "+Math.round(o.temp)+"° · "+T[L][w[1]]+(o.name?" · "+o.name:"");
}
var cached=sget("lastwx");
if(cached){try{showWx(JSON.parse(cached))}catch(e){}}

function getJSON(u){return fetch(u).then(function(r){return r.json()})}
function loadWeather(){
  var loc=null;try{loc=JSON.parse(sget("loc")||"null")}catch(e){}
  var p=loc?Promise.resolve(loc):getJSON("https://ipwho.is/").then(function(j){
    if(!j.success)throw 0;
    loc={lat:j.latitude,lon:j.longitude,name:j.city};sset("loc",JSON.stringify(loc));return loc;
  });
  p.then(function(l){
    return getJSON("https://api.open-meteo.com/v1/forecast?latitude="+l.lat+"&longitude="+l.lon+"&current=temperature_2m,weather_code&timezone=auto")
      .then(function(d){
        var o={temp:d.current.temperature_2m,code:d.current.weather_code,name:l.name};
        sset("lastwx",JSON.stringify(o));showWx(o);
      });
  }).catch(function(){if(!lastW){$("wc").setAttribute("data-i","werr");$("wc").textContent=T[L].werr}});
}
loadWeather();setInterval(loadWeather,30*60*1000);

$("saveCity").onclick=function(){
  var n=$("city").value.trim();if(!n)return;
  say("searching");
  getJSON("https://geocoding-api.open-meteo.com/v1/search?count=1&language="+L+"&name="+encodeURIComponent(n))
    .then(function(j){
      var r=j.results&&j.results[0];if(!r){say("nocity");return}
      sset("loc",JSON.stringify({lat:r.latitude,lon:r.longitude,name:r.name}));
      say("saved");loadWeather();
    }).catch(function(){say("noconn")});
};

var CF="https://speed.cloudflare.com/__",running=false;
function fmt(x){return x>=100?String(Math.round(x)):x.toFixed(1)}
function setKey(id,k){var e=$(id);e.setAttribute("data-i",k);e.textContent=T[L][k]}
function pingTest(){
  var t=[],n=0;
  return new Promise(function(res,rej){
    (function next(){
      var s=performance.now();
      fetch(CF+"down?bytes=0&r="+Math.random(),{cache:"no-store"}).then(function(r){return r.arrayBuffer()}).then(function(){
        t.push(performance.now()-s);
        if(++n<5)next();else{t.shift();t.sort(function(a,b){return a-b});res(t[Math.floor(t.length/2)])}
      }).catch(rej);
    })();
  });
}
function downTest(){
  return new Promise(function(res,rej){
    var ctl=window.AbortController?new AbortController():null,got=0,done=false,last=0,tStart=performance.now(),t0=0,tm;
    function mbps(){return got*8/1e6/Math.max((performance.now()-t0)/1000,0.1)}
    function finish(){
      if(done)return;done=true;clearTimeout(tm);
      var m=mbps(),g=got;
      if(ctl)try{ctl.abort()}catch(e){}
      g?res(m):rej(new Error("no data"));
    }
    tm=setTimeout(finish,8000);
    fetch(CF+"down?bytes=50000000&r="+Math.random(),{cache:"no-store",signal:ctl?ctl.signal:undefined}).then(function(r){
      if(!r.body||!r.body.getReader){
        return r.arrayBuffer().then(function(b){t0=tStart;got=b.byteLength;finish()});
      }
      var rd=r.body.getReader();
      (function pump(){
        rd.read().then(function(o){
          if(done)return;
          if(o.done){finish();return}
          if(!t0)t0=performance.now();
          got+=o.value.length;
          var now=performance.now();
          if(now-last>250){last=now;$("sd").textContent=fmt(mbps())}
          pump();
        }).catch(function(e){if(!done)finish()});
      })();
    }).catch(function(e){if(!done){done=true;clearTimeout(tm);rej(e)}});
  });
}
function upTest(){
  return new Promise(function(res,rej){
    var x=new XMLHttpRequest(),t0=performance.now(),m=0,done=false,tm;
    function fin(){if(done)return;done=true;clearTimeout(tm);m?res(m):rej(new Error("up"))}
    tm=setTimeout(function(){try{x.abort()}catch(e){}fin()},7000);
    x.upload.onprogress=function(e){var sec=(performance.now()-t0)/1000;if(sec>0.3){m=e.loaded*8/1e6/sec;$("su").textContent=fmt(m)}};
    x.onload=function(){m=6000000*8/1e6/Math.max((performance.now()-t0)/1000,0.1);fin()};
    x.onerror=function(){fin()};
    x.open("POST",CF+"up?r="+Math.random());
    x.send(new Uint8Array(6000000));
  });
}

function resolveId(src,idx){
  if(src.t==="lg")return Promise.resolve(src.id);
  var key="mid"+idx,c=sget(key);
  if(c)return Promise.resolve(c);
  var p;
  if(src.t==="team"){

      var a=(j.teams||[]).filter(function(x){return x.strSport==="Soccer"});
      var ex=a.filter(function(x){return(x.strTeam||"").toLowerCase()===src.q.toLowerCase()})[0]||a[0];
      return ex&&ex.idTeam;
    });
  }else{
    p=tsdb("search_all_leagues.php?c="+encodeURIComponent(src.c)+"&s=Soccer").then(function(j){
      var a=(j.countries||j.leagues||[]).filter(function(x){return(x.strLeague||"").toLowerCase().indexOf(src.n.toLowerCase())>=0});

function dayLabel(t){
  var d=new Date(t),n=new Date(),tm=new Date(n.getTime()+864e5);

  var hh=d.toLocaleTimeString(LOC[L],{hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
  var dd=k(d)===k(n)?T[L].today:k(d)===k(tm)?T[L].tmrw:d.toLocaleDateString(LOC[L],{weekday:"short",day:"numeric",month:"short"});

}

  var k=e.key||KEYS[e.keyCode];

    if(panelOpen()){e.preventDefault();closePanel()}else if(appsOpen()){e.preventDefault();closeApps()}return;
  }
  if(k==="ContextMenu"||k==="Menu"){e.preventDefault();panelOpen()?closePanel():openPanel();return}
  var it=items(),i=it.indexOf(document.activeElement);
  if(i<0){if(it[0])it[0].focus();return}
  var inInput=document.activeElement.tagName==="INPUT";
  var c=cols(),n=i,rtl=document.documentElement.dir==="rtl";
  if(k==="ArrowDown")n=i+c;else if(k==="ArrowUp")n=i-c;
  else if(!inInput&&k===(rtl?"ArrowLeft":"ArrowRight"))n=i+1;else if(!inInput&&k===(rtl?"ArrowRight":"ArrowLeft"))n=i-1;
  else return;
  e.preventDefault();
  if(n>=0&&n<it.length)it[n].focus();
});
